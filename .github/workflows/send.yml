name: Send Douyin Messages
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Read-only diagnostics only on this branch
        type: boolean
        default: true
concurrency:
  group: douyin-daily-sender
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      DOUYIN_STATE_KEY: ${{ secrets.DOUYIN_STATE_KEY }}
      DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
      DOUYIN_CONFIG: ${{ secrets.DOUYIN_CONFIG }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Restore last production session for read-only diagnosis
        uses: actions/cache/restore@v4
        with:
          path: artifacts/session.enc
          key: douyin-session-v1-main-37141119396-1
          fail-on-cache-miss: true
      - name: Diagnose without sending or changing credentials
        run: python scripts/diagnose_auth.py --network
